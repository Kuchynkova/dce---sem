services:
  postgresqldb:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - back-tier

  setup:
      build:
        context: .
        dockerfile: Dockerfile.setup
      command: >
        sh -c "psql -h postgresqldb -U root -d test_db -c 'SELECT 1 FROM flashcards;' >/dev/null 2>&1 || 
              (psql -h postgresqldb -U root -d test_db -f /opt/setup/create_schema.sql && 
                psql -h postgresqldb -U root -d test_db -f /opt/setup/populate_schema.sql)"
      depends_on:
        postgresqldb:
          condition: service_healthy
      networks:
        - back-tier

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    depends_on:
      setup:
        condition: service_completed_successfully
    networks:
      - front-tier
      - back-tier

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - front-tier

  devel:
    build:
      context: .
      dockerfile: Dockerfile.devel
    volumes:
      - .:/workspaces/${COMPOSE_PROJECT_NAME:-semestralka-flashcards}
    ports:
      - "8088:5000"
    command: sleep infinity
    depends_on:
      postgresqldb:
        condition: service_healthy
    networks:
      - back-tier

# Zde definujeme samotné sítě
networks:
  front-tier:
  back-tier:

volumes:
  db_data:
