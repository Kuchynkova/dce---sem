services:
  postgresqldb:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  setup:
    build:
      context: .
      dockerfile: Dockerfile.setup
    command: >
      sh -c "psql -h postgresqldb -U root -d test_db -f /opt/setup/create_schema.sql && 
             psql -h postgresqldb -U root -d test_db -f /opt/setup/populate_schema.sql"
    depends_on:
      postgresqldb:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    depends_on:
      setup:
        condition: service_completed_successfully
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
  devel:
    build:
      context: .
      dockerfile: Dockerfile.devel
    volumes:
      # aby to šlo upravovat živě
      - .:/workspaces/${COMPOSE_PROJECT_NAME:-semestralka-flashcards}
    ports:
      - "8088:5000"
    # Udrží kontejner běžící, dokud se do něj nepřipojí VS Code
    command: sleep infinity
    depends_on:
      postgresqldb:
        condition: service_healthy
  